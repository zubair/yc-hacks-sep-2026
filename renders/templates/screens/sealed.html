<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="shared.css">
<style>
  .photo { left: 38px; top: 38px; right: 38px; height: 452px; border-radius: 8px; }
  .script { position: absolute; left: 80px; top: 372px; font-family: var(--hand); font-size: 42px; line-height: 1.15; color: #fffaf1; transform: rotate(-5deg); transform-origin: 0 0; text-shadow: 0 1px 12px rgba(0,0,0,.35); white-space: pre; }
  .stamp { right: 92px; top: 66px; transform: rotate(3deg); filter: drop-shadow(0 3px 5px rgba(0,0,0,.25)); }
  .postmark { top: 70px; }
  .ready { position: absolute; left: 70px; top: 516px; font: 400 70px/1 var(--serif); letter-spacing: -.01em; }
  .to { position: absolute; left: 74px; top: 598px; font-size: 21px; letter-spacing: .22em; }
  .opts { position: absolute; left: 70px; bottom: 44px; display: flex; align-items: center; gap: 22px; font: 400 25px var(--sans); color: var(--ink); }
  .opt { display: flex; align-items: center; gap: 14px; }
  .radio { width: 30px; height: 30px; border-radius: 50%; border: 1.6px solid var(--ink); display: grid; place-items: center; }
  .radio.on::after { content: ''; width: 14px; height: 14px; border-radius: 50%; background: var(--ink); }
  .sep { width: 1.5px; height: 34px; background: var(--ink-faint); }
  .go { position: absolute; right: 64px; bottom: 40px; }
</style></head>
<body><div class="screen paper" id="s">
  <div class="photo"><img id="img"></div>
  <div class="script" id="script"></div>
  <div class="stamp" id="stamp"></div>
  <div class="postmark" id="pm"></div>
  <div class="ready" id="ready"></div>
  <div class="label to" id="to"></div>
  <div class="opts" id="opts"></div>
  <div class="pill solid go"><span id="cont"></span><span id="arrow"></span></div>
</div>
<script src="shared.js"></script>
<script>
PC.boot(async ({ data, geo, photoURL, nat }) => {
  const s = document.getElementById('s');
  s.style.setProperty('--w', geo.cover.width + 'px'); s.style.setProperty('--h', geo.cover.height + 'px');
  const img = document.getElementById('img');
  img.src = photoURL; img.style.objectPosition = `${data.photo.focus[0] * 100}% ${data.photo.focus[1] * 100}%`;
  document.getElementById('script').textContent = `${data.place},\n${data.country}`;
  document.getElementById('stamp').innerHTML = PC.stampSVG({ w: 124, h: 152, photoURL, nat, focus: data.photo.stampFocus, country: data.stamp.country, value: data.stamp.value, tone: 'vermilion' });
  const pm = document.getElementById('pm');
  const words = data.copy.sealedMark.toUpperCase().split(' ');
  const mid = Math.ceil(words.length / 2);
  pm.innerHTML = PC.postmarkSVG({ r: 78, top: data.postmark.top, bottom: data.dates.postmark, center: [words.slice(0, mid).join(' '), words.slice(mid).join(' ')], heart: true, ink: 'vermilion', waves: 'left', waveLength: 120, rotate: -10, seed: 21 });
  PC.placePostmark(pm, { cx: 846, cy: 146, r: 78, waves: 'left', waveLength: 120 });
  document.getElementById('ready').textContent = data.copy.ready;
  document.getElementById('to').textContent = data.copy.readyTo;
  document.getElementById('opts').innerHTML = data.delivery.options.map((o, i) =>
    `${i ? '<span class="sep"></span>' : ''}<span class="opt"><span class="radio ${o === data.delivery.channel ? 'on' : ''}"></span>${PC.esc(o)}</span>`).join('');
  document.getElementById('cont').textContent = data.copy.continue;
  document.getElementById('arrow').innerHTML = PC.arrowSVG('#f6f1e7');
});
</script></body></html>
