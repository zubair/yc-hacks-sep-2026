name: Postcard
options:
  bundleIdPrefix: com.barrat
  deploymentTarget:
    iOS: "27.1"
  xcodeVersion: "27.1"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  Postcard:
    type: application
    platform: iOS
    sources:
      - path: Postcard
    info:
      path: Postcard/Info.plist
      properties:
        CFBundleDisplayName: Postcard
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        # Public HTTPS base URL of Pranav's service. Empty = labeled fixture publisher. Never a secret.
        PostcardAPIBaseURL: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.barrat.postcard
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  Postcard:
    build:
      targets:
        Postcard: all
    run:
      config: Debug
