name: Postcard
options:
  bundleIdPrefix: com.postcard
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  PostcardCore:
    path: ../packages/PostcardCore
  PostcardServices:
    path: ../packages/PostcardServices
  PostcardMotion:
    path: ../packages/PostcardMotion
  PostcardUI:
    path: ../packages/PostcardUI
targets:
  Postcard:
    type: application
    platform: iOS
    sources:
      - App
      - Features
      - Platform
      - path: Config
        excludes:
          - Info.plist
          - LocalConfig.plist.example
          - .gitignore
    dependencies:
      - package: PostcardCore
      - package: PostcardServices
      - package: PostcardMotion
      - package: PostcardUI
    info:
      path: Config/Info.plist
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.postcard.app
  PostcardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/UI
    dependencies:
      - target: Postcard
    settings:
      base:
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.postcard.app.uitests
  PostcardAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/App
    dependencies:
      - target: Postcard
      - package: PostcardCore
      - package: PostcardServices
    settings:
      base:
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.postcard.app.tests
schemes:
  Postcard:
    build:
      targets:
        Postcard: all
        PostcardAppTests: [test]
        PostcardUITests: [test]
    run:
      config: Debug
    test:
      targets:
        - PostcardAppTests
        - PostcardUITests
