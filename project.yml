name: FoldGonio
options:
  bundleIdPrefix: dev.foldgonio
  deploymentTarget:
    iOS: "27.1"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "27.1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  FoldGonio:
    type: application
    platform: iOS
    sources:
      - path: FoldGonio
    info:
      path: FoldGonio/Info.plist
      properties:
        CFBundleDisplayName: FoldGonio
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          # Clinician view: one window per patient, side by side on the inner display.
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.foldgonio.FoldGonio
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  FoldGonio:
    build:
      targets:
        FoldGonio: all
    run:
      config: Debug
